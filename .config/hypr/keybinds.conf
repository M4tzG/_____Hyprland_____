###################
###  PROGRAMAS  ###
###################

$terminal_floated = kitty --title float-terminal
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$editor = kate
$browser_dev = firefox-developer-edition
$browser_ = firefox
$browser2 = firefox --no-remote -P caba
$code = code
$ranger = kitty ranger


####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER
# ---------------------------------------
bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, $terminal_floated
bind = $mainMod, W, exec, $ranger
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, D, exec, $editor
bind = $mainMod, J, exec, $browser_dev
bind = $mainMod, K, exec, $browser_
bind = $mainMod SHIFT, L, exec, $browser2
bind = $mainMod, F, exec, $code


bind = $mainMod, T, exec, killall waybar || waybar

bind = $mainMod, O, exec, hyprpaper &

#sudo pacman -S grim slurp
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/PERSONAL/ORG/IMGS/prints/$(date +%Y-%m-%d_%H%M%S).png

# sudo pacman -S wl-clipboard
bind = $mainMod, Print, exec, bash -c 'grim -g "$(slurp)" - | wl-copy --type image/png'


# ---------------------------------------
# reload
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ---------------------------------------
# Brightness
# sudo pacman -S brightnessctl

bind = , xf86monbrightnessup, exec, brightnessctl set 10%+
bind = , xf86monbrightnessdown, exec, brightnessctl set 10%-

# ---------------------------------------
# volume pulse audio
bind = , xf86audioraisevolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

bind = , xf86audiolowervolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bind = , xf86audiomute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle


# volume piperire
# bind = , xf86audioraisevolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%+
# bind = , xf86audiolowervolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%-
# bind = , xf86audiomute, exec, wpctl set-mute @DEFAULT_SINK@ toggle

# ---------------------------------------

# sudo pacman -S hyprlock
bind = SUPER, X, exec, hyprlock


# ---------------------------------------
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ---------------------------------------
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ---------------------------------------
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ---------------------------------------
# special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ---------------------------------------
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ---------------------------------------
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

